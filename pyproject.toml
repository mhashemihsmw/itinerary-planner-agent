[project]
name = "info-extractor"
version = "0.1.0"
description = "Info extractor service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "python-dotenv==1.0.1",
    "openai==1.58.1",
    "requests==2.32.5",
    "yt-dlp==2024.08.06",
    "faster-whisper==1.0.3",
    "ffmpeg==1.4",
    "ffprobe==0.5",
    "SQLAlchemy==2.0.36",
    "aiosqlite==0.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["__pycache__"]
